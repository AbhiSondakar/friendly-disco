spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: none
  data:
    redis:
      repositories:
        enabled: false

server:
  port: 0

ecoloop:
  ai:
    provider: stub
