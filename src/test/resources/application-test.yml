spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  session:
    store-type: none
  data:
    redis:
      repositories:
        enabled: false

server:
  port: 0

ecoloop:
  ai:
    provider: stub
  routing:
    offer-expiration:
      enabled: false
      interval-ms: 60000
      batch-size: 100
